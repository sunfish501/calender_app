  // Kick off subscriber sync once we have an auth session.
  let _sharesSyncedOnce = false;
  async function maybeSyncShares() {
    if (_sharesSyncedOnce) return;
    if (!window.SupabaseAuth?.getUser()) return;
    _sharesSyncedOnce = true;
    try {
      const changed = await pullSubscribedShares();
      if (changed) {
        saveThemes();
        saveEvents();
        renderSidebar();
        render();
      }
      setupShareRealtime();
    } catch (e) {
      console.warn('[share] initial sync failed:', e);
      _sharesSyncedOnce = false;
    } finally {
      // Run invite handling regardless of sync outcome.
      checkAndShowInvite().catch(e => console.warn('[invite] failed:', e));
    }
  }
  window.SupabaseAuth?.onAuthChange((user) => {
    if (user) {
      maybeSyncShares();
    } else {
      _sharesSyncedOnce = false;
      if (_shareRealtimeUnsub) { _shareRealtimeUnsub(); _shareRealtimeUnsub = null; }
      _shareRealtimeCodes = '';
    }
  });
  // Also try once after initial load (if already signed in).
  setTimeout(maybeSyncShares, 1500);

  // 모달 삭제 버튼
  document.getElementById('modal-del-btn').onclick = () => {
    if (!editingEvent) return;
    const { dk, idx } = editingEvent;
    if (!confirm('이 일정을 삭제하시겠습니까?')) return;
    if (events[dk]) {
      events[dk].splice(idx, 1);
      if (events[dk].length === 0) delete events[dk];
      saveEvents();
      render();
    }
    closeModal();
  };

  // ─── QWER 필터링 (누르고 있는 동안만) ──────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.repeat) return;
    const ki = THEME_KEYS.indexOf(e.key.toLowerCase());
    if (ki !== -1 && ki < themes.length) {
      e.preventDefault();
      const th = themes[ki];
      activeFilter = th.id;
      filterBadge.textContent = th.name + ' 필터';
      filterBadge.style.background = th.color;
      filterBadge.style.display = 'block';
      render();
    }
  });
  document.addEventListener('keyup', (e) => {
    const ki = THEME_KEYS.indexOf(e.key.toLowerCase());
    if (ki !== -1 && activeFilter) {
      activeFilter = null;
      filterBadge.style.display = 'none';
      render();
    }
  });

  // ─── 하단 단축키 안내 ──────────────────────────────────────
  const shortcutHelpEl = document.getElementById('shortcut-help');
  // ─── 사이드바 체크박스 필터 ────────────────────────────────
  const FILTER_KEY = 'calendar-theme-filter-v1';
  let checkedThemes = new Set();
  const sidebarItems = document.getElementById('sidebar-items');
  const allThemeIds = () => [...themes.map(t => t.id), '__none__'];

  // 처음 진입이면 전체 활성화, 저장된 게 있으면 복원
  (function initFilter() {
    try {
      const stored = JSON.parse(localStorage.getItem(FILTER_KEY) || 'null');
      if (Array.isArray(stored)) {
        checkedThemes = new Set(stored);
        // 새 테마는 기본 활성화 (저장된 set에 없으면 추가)
        allThemeIds().forEach(id => {
          if (![...checkedThemes].some(s => s === id) && !stored.includes('__explicit__')) {
            // 명시적으로 꺼져 있던 게 아니면 자동 추가
          }
        });
        return;
      }
    } catch {}
    allThemeIds().forEach(id => checkedThemes.add(id));
  })();
  function saveThemeFilter() {
    localStorage.setItem(FILTER_KEY, JSON.stringify([...checkedThemes]));
  }

  function renderSidebar() {
    sidebarItems.innerHTML = '';
    const ids = allThemeIds();
    const allOn = ids.length > 0 && ids.every(id => checkedThemes.has(id));

    // "전체" 체크박스
    const allItem = document.createElement('label');
    allItem.className = 'sidebar-item';
    const allCb = document.createElement('input');
    allCb.type = 'checkbox';
    allCb.checked = allOn;
    allCb.onchange = () => {
      if (allOn) {
        checkedThemes.clear();
      } else {
        ids.forEach(id => checkedThemes.add(id));
      }
      saveThemeFilter();
      renderSidebar();
      render();
    };
    allItem.appendChild(allCb);
    const allLabel = document.createElement('span');
    allLabel.className = 'sidebar-label';
    allLabel.textContent = '전체';
    allItem.appendChild(allLabel);
    sidebarItems.appendChild(allItem);

    // 각 테마
    themes.forEach(th => {
      const item = document.createElement('label');
      item.className = 'sidebar-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = checkedThemes.has(th.id);
      cb.onchange = () => {
        if (cb.checked) checkedThemes.add(th.id);
        else checkedThemes.delete(th.id);
        saveThemeFilter();
        renderSidebar();
        render();
      };
      item.appendChild(cb);
      const dot = document.createElement('span');
      dot.className = 'sidebar-dot';
      dot.style.background = th.color;
      item.appendChild(dot);
      // "(공유)" 같은 접미사는 dim 처리
      const label = document.createElement('span');
      label.className = 'sidebar-label';
      const suffixMatch = th.name.match(/^(.*?)(\s*\([^)]+\))$/);
      if (suffixMatch) {
        label.appendChild(document.createTextNode(suffixMatch[1]));
        const dim = document.createElement('span');
        dim.className = 'dim';
        dim.textContent = suffixMatch[2];
        label.appendChild(dim);
      } else {
        label.textContent = th.name;
      }
      item.appendChild(label);
      sidebarItems.appendChild(item);
    });

    // "테마 없음"
    const noneItem = document.createElement('label');
    noneItem.className = 'sidebar-item';
    const noneCb = document.createElement('input');
    noneCb.type = 'checkbox';
    noneCb.checked = checkedThemes.has('__none__');
    noneCb.onchange = () => {
      if (noneCb.checked) checkedThemes.add('__none__');
      else checkedThemes.delete('__none__');
      saveThemeFilter();
      renderSidebar();
      render();
    };
    noneItem.appendChild(noneCb);
    const noneDot = document.createElement('span');
    noneDot.className = 'sidebar-dot none-dot';
    noneItem.appendChild(noneDot);
    const noneLabel = document.createElement('span');
    noneLabel.className = 'sidebar-label';
    noneLabel.textContent = '테마 없음';
    noneItem.appendChild(noneLabel);
    sidebarItems.appendChild(noneItem);
  }
  renderSidebar();

  function updateShortcutHelp() {
    let html = '<span>날짜 클릭 — 메뉴</span><span>일정 클릭 — 편집</span><span>우클릭 — 별표</span><span>1 — 별표</span><span>마우스 3바퀴 — 동그라미</span><span>Backspace — 제거</span>';
    themes.forEach((th, i) => {
      if (THEME_KEYS[i]) {
        html += `<span style="border-left:3px solid ${th.color};padding-left:6px;">${THEME_KEYS[i].toUpperCase()} 꾹 — ${th.name}</span>`;
      }
    });
    shortcutHelpEl.innerHTML = html;
  }
  updateShortcutHelp();

  // Alt 누르면 단축키 안내 표시
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Alt') { e.preventDefault(); shortcutHelpEl.classList.add('visible'); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Alt') shortcutHelpEl.classList.remove('visible');
  });
  window.addEventListener('blur', () => shortcutHelpEl.classList.remove('visible'));

  // ─── 년월 피커 ──────────────────────────────────────────
  const datePicker = document.getElementById('date-picker');
  const dpYear = document.getElementById('dp-year');
  const dpMonth = document.getElementById('dp-month');

  document.getElementById('month-label').onclick = (e) => {
    e.stopPropagation();
    datePicker.classList.toggle('open');
    if (datePicker.classList.contains('open')) renderDatePicker();
  };
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#date-picker') && !e.target.closest('#month-label')) {
      datePicker.classList.remove('open');
    }
  });

  function renderDatePicker() {
    dpYear.innerHTML = '';
    dpMonth.innerHTML = '';
    const curY = new Date().getFullYear();
    for (let y = curY - 10; y <= curY + 10; y++) {
      const el = document.createElement('div');
      el.className = 'date-picker-item' + (y === viewYear ? ' selected' : '');
      el.textContent = y + '년';
      el.onclick = (e) => { e.stopPropagation(); viewYear = y; render(); renderDatePicker(); };
      dpYear.appendChild(el);
    }
    for (let m = 0; m < 12; m++) {
      const el = document.createElement('div');
      el.className = 'date-picker-item' + (m === viewMonth ? ' selected' : '');
      el.textContent = (m + 1) + '월';
      el.onclick = (e) => { e.stopPropagation(); viewMonth = m; render(); renderDatePicker(); datePicker.classList.remove('open'); };
      dpMonth.appendChild(el);
    }
    const selY = dpYear.querySelector('.selected');
    if (selY) selY.scrollIntoView({ block: 'center', behavior: 'instant' });
    const selM = dpMonth.querySelector('.selected');
    if (selM) selM.scrollIntoView({ block: 'center', behavior: 'instant' });
  }

  // 화살표 키로 월 이동
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (viewMode === 'timetable') { weekOffset--; } else { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } }
      render();
    }
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (viewMode === 'timetable') { weekOffset++; } else { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
      render();
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (viewMode === 'timetable') { weekOffset -= 4; } else { viewYear--; }
      render();
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (viewMode === 'timetable') { weekOffset += 4; } else { viewYear++; }
      render();
    }
  });

  async function saveNewEvent() {
    const date = eventDateInput.value;
    const text = eventTextInput.value.trim();
    if (!date || !text) {
      alert('날짜와 일정 내용을 모두 입력해주세요.');
      return;
    }
    const selThemes = [...modalSelectedThemes];

    // 공유 테마(owner)에 일정 추가 시 확인 + 브로드캐스트
    const sharedOwned = selThemes
      .map(tid => themes.find(t => t.id === tid))
      .filter(t => t?.share_role === 'owner' && t?.share_code);

    if (sharedOwned.length > 0 && !editingEvent) {
      const ok = await showShareEventConfirm(sharedOwned, text);
      if (!ok) return;
    }

    if (editingEvent) {
      // 편집 모드
      const { dk, idx } = editingEvent;
      const orig = (events[dk] || [])[idx];
      if (!orig) { closeModal(); return; }
      // 시간표 항목인지 보존
      const isTT = isTimetableEvent(orig);
      // 시간 태그(HH:00) 보존: 사용자가 텍스트만 바꿨다면 기존 태그가 있던 경우 유지
      let finalText = text;
      if (isTT) {
        const origText = getEventText(orig);
        const tm = origText.match(/\(\d{1,2}:\d{2}\)/);
        const userTm = text.match(/\(\d{1,2}:\d{2}\)/);
        if (tm && !userTm) finalText = text + ' ' + tm[0];
      }
      // 날짜가 바뀐 경우 이동
      if (date !== dk) {
        events[dk].splice(idx, 1);
        if (events[dk].length === 0) delete events[dk];
        if (!events[date]) events[date] = [];
        const newItem = { t: finalText };
        if (isTT) newItem.tt = true;
        setEventThemes(newItem, selThemes);
        events[date].push(newItem);
      } else {
        // 같은 자리에서 갱신
        if (typeof orig === 'string') {
          const obj = { t: finalText };
          if (isTT) obj.tt = true;
          setEventThemes(obj, selThemes);
          events[dk][idx] = obj;
        } else {
          orig.t = finalText;
          if (isTT) orig.tt = true;
          setEventThemes(orig, selThemes);
        }
      }
    } else {
      // 추가 모드
      if (!events[date]) events[date] = [];
      if (selThemes.length > 0) {
        const obj = { t: text };
        setEventThemes(obj, selThemes);
        events[date].push(obj);
      } else {
        events[date].push(text);
      }
    }
    saveEvents();
    closeModal();
    render();
    checkUpcomingEvents();

    // 브로드캐스트: 공유 테마에 일정이 추가됐을 때 구독자들에게 알림
    if (sharedOwned.length > 0 && !editingEvent) {
      sharedOwned.forEach(t => {
        window.ThemeShare?.broadcastEventToSubscribers(t.share_code, {
          themeName: t.name, date, text
        }).catch(() => {});
      });
    }
  }

  // ─── 공유 테마 일정 추가 확인 모달 ───────────────────────────────────────────
  async function showShareEventConfirm(sharedThemes, eventText) {
    // 구독자 목록 조회
    let allSubs = [];
    for (const t of sharedThemes) {
      try {
        const subs = await window.ThemeShare?.fetchSubscribers(t.share_code);
        if (Array.isArray(subs)) {
          subs.forEach(s => { if (!allSubs.find(x => x.user_id === s.user_id)) allSubs.push(s); });
        }
      } catch (_) {}
    }

    const names = allSubs.map(s => s.display_name || '익명').filter(Boolean);
    const summary = names.length === 0 ? '(아직 구독자 없음)'
      : names.length <= 3 ? names.join(', ')
      : names.slice(0, 2).join(', ') + ' 외 ' + (names.length - 2) + '명';

    return new Promise(resolve => {
      const back = document.createElement('div');
      back.className = 'gc-backdrop';
      back.innerHTML = `
        <div class="gc-card" style="width:380px;">
          <div class="gc-card-icon" style="background:#fff8e6;color:#e8a020;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <h2 class="gc-card-title">공유 일정 추가</h2>
          <p class="gc-card-desc">
            <b>${escapeHtml(summary)}</b>과(와) 이 일정을 공유합니다.<br>
            <span style="color:#5f6368;font-size:0.9em;">"${escapeHtml(eventText)}"</span>
          </p>
          <div class="gc-card-actions">
            <button class="gc-btn gc-btn-secondary" id="sec-cancel">취소</button>
            <button class="gc-btn gc-btn-primary"   id="sec-ok">계속하기</button>
          </div>
        </div>`;
      document.body.appendChild(back);
      const close = ok => { back.remove(); resolve(ok); };
      back.querySelector('#sec-ok').onclick     = () => close(true);
      back.querySelector('#sec-cancel').onclick = () => close(false);
      back.onclick = e => { if (e.target === back) close(false); };
    });
  }

  function showInAppNotif(title, body) {
    const el = document.createElement('div');
    el.className = 'notif';
    el.innerHTML = `
      <button class="notif-close">✕</button>
      <div class="notif-title">${escapeHtml(title)}</div>
      <div class="notif-body">${escapeHtml(body)}</div>
    `;
    el.querySelector('.notif-close').onclick = () => el.remove();
    notificationsEl.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 15000);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function showBrowserNotif(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body, icon: '' }); } catch (e) {}
    }
  }

  function checkUpcomingEvents() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowKey = dateKey(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate());
    const notified = getNotified();
    const todayK = todayKey();

    const cleaned = {};
    Object.keys(notified).forEach(k => {
      if (k >= todayK) cleaned[k] = notified[k];
    });

    const tomorrowEvents = events[tomorrowKey] || [];
    tomorrowEvents.forEach(ev => {
      const notifKey = `${tomorrowKey}::${ev}`;
      if (!cleaned[notifKey]) {
        const title = '📅 내일의 일정';
        const body = `내일(${tomorrow.getMonth() + 1}월 ${tomorrow.getDate()}일) "${ev}" 일정이 있어요!`;
        showInAppNotif(title, body);
        showBrowserNotif(title, body);
        cleaned[notifKey] = true;
      }
    });

    const todayEvents = events[todayK] || [];
    todayEvents.forEach(ev => {
      const notifKey = `today::${todayK}::${ev}`;
      if (!cleaned[notifKey]) {
        const title = '⭐ 오늘의 일정';
        const body = `오늘 "${ev}" 일정이 있어요!`;
        showInAppNotif(title, body);
        showBrowserNotif(title, body);
        cleaned[notifKey] = true;
      }
    });

    saveNotified(cleaned);
  }

  // Export / Import
  document.getElementById('export-btn').onclick = () => {
    const data = JSON.stringify(events, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `calendar-events-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showInAppNotif('내보내기 완료', 'JSON 파일로 저장되었어요.');
  };

  document.getElementById('import-btn').onclick = () => {
    document.getElementById('import-file').click();
  };

  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (typeof data !== 'object' || Array.isArray(data)) throw new Error('형식이 잘못되었습니다.');
        if (confirm('현재 일정과 합칠까요?\n확인: 합치기 / 취소: 덮어쓰기')) {
          Object.keys(data).forEach(k => {
            if (!events[k]) events[k] = [];
            events[k] = events[k].concat(data[k]);
          });
        } else {
          events = data;
        }
        saveEvents();
        render();
        showInAppNotif('가져오기 완료', '일정이 불러와졌어요.');
      } catch (err) {
        alert('파일을 읽을 수 없습니다: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // favicon 자정 갱신 / visibilitychange 시 재그리기 — 초기 그리기는 head 의
  // inline 스크립트가 이미 해줬으므로 여기서는 갱신만 담당.
  (function scheduleFaviconRefresh() {
    const refresh = window.__refreshFavicon;
    if (typeof refresh !== 'function') return;
    function scheduleMidnight() {
      const now = new Date();
      const tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      const ms = Math.max(60_000, tmr - now);
      setTimeout(() => { refresh(); scheduleMidnight(); }, ms);
    }
    scheduleMidnight();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refresh();
    });
  })();

  // Initial render + checks
  render();
  checkUpcomingEvents();

  // 구독 테마 새 일정 실시간 알림 수신
  (function setupEventBroadcastListening() {
    const subThemes = themes.filter(t => t.share_role === 'subscriber' && t.share_code);
    if (!subThemes.length || !window.ThemeShare?.listenForEventBroadcasts) return;
    window.ThemeShare.listenForEventBroadcasts(
      subThemes.map(t => t.share_code),
      (code, { themeName, date, text }) => {
        const localTheme = themes.find(t => t.share_code === code);
        const dispName = (localTheme?.name || themeName || '공유 테마').replace(' (공유)', '');
        showInAppNotif(`📅 ${escapeHtml(dispName)}에 새 일정`, `${date}  ${escapeHtml(text)}`);
      }
    );
  })();

  // Re-check every 30 minutes in case the page stays open across days
  setInterval(checkUpcomingEvents, 30 * 60 * 1000);

  // invite.html 랜딩 → calendar.html?invite=CODE 자동 처리
  (function handleInviteParam() {
    const code = new URLSearchParams(location.search).get('invite');
    if (!code) return;
    // URL에서 파라미터 제거 (뒤로가기 시 재실행 방지)
    const clean = new URL(location.href);
    clean.searchParams.delete('invite');
    history.replaceState({}, '', clean.toString());

    async function doAutoImport() {
      if (!window.SupabaseAuth?.getUser()) {
        // 로그인 안 된 상태면 수동 입력창 오픈
        importThemeFlow();
        return;
      }
      try {
        const share = await window.ThemeShare.fetchShare(code);
        const result = applyImportedShare(share.payload, share.code);
        showToast(`✓ "${result.themeName}" 추가됨 · 일정 ${result.eventsAdded}개`);
        saveThemes(); saveEvents();
        renderThemeModal(); updateShortcutHelp(); renderSidebar(); render();
        setupShareRealtime();
      } catch (e) {
        showToast('초대 처리 실패: ' + (e.message || '오류'));
      }
    }

    // 인증 상태가 확정될 때까지 잠깐 대기
    setTimeout(doAutoImport, 900);
  })();
</script>
</body>
