  // ─── 시간표 셀 디자인 (사용자 커스터마이즈) ─────────────────
  // 저장 키: cellDesigns[colDayKey][hour] OR cellDesigns.__row__[hour] OR cellDesigns.__col__[col]
  // 각 디자인: { bg, fg, bold, italic, fontFamily, align }
  const CELL_DESIGN_KEY = 'calendar-cell-design-v1';
  let cellDesigns = { byCell: {}, byRow: {}, byCol: {} };
  try {
    const stored = JSON.parse(localStorage.getItem(CELL_DESIGN_KEY) || 'null');
    if (stored && typeof stored === 'object') {
      cellDesigns = Object.assign(cellDesigns, stored);
    }
  } catch {}
  function saveCellDesigns() {
    localStorage.setItem(CELL_DESIGN_KEY, JSON.stringify(cellDesigns));
  }
  // 행 키: 요일은 dayKeys[col], 시간은 hour. cellKey = col(요일)+hour
  // 단순화: byCell 키 = "DOWidx_hour" (DOWidx 0~6, 월=0)
  function cellDesignKey(col, hour) { return col + '_' + hour; }
  function getCellDesign(col, hour) {
    const rowD = cellDesigns.byRow[hour] || {};
    const colD = cellDesigns.byCol[col] || {};
    const cellD = cellDesigns.byCell[cellDesignKey(col, hour)] || {};
    // 셀 > 행 > 열 우선순위 (셀 가장 강함)
    return Object.assign({}, colD, rowD, cellD);
  }
  function applyCellDesign(el, d) {
    if (!d) return;
    if (d.bg) el.style.background = d.bg;
    if (d.fg) el.style.color = d.fg;
    if (d.bold) el.style.fontWeight = '700';
    if (d.italic) el.style.fontStyle = 'italic';
    if (d.fontFamily) el.style.fontFamily = d.fontFamily;
    if (d.align) el.style.justifyContent = d.align === 'left' ? 'flex-start' : d.align === 'right' ? 'flex-end' : 'center';
  }

  // 시간표 셀 디자인 모드
  let cellDesignMode = false;
  let designPanelEl = null;

  function openDesignPanel(target, col, hour, x, y) {
    closeDesignPanel();
    // target: 'cell' | 'row' | 'col'
    let scopeKey = 'cell';
    function readDesign() {
      if (scopeKey === 'cell') return cellDesigns.byCell[cellDesignKey(col, hour)] || {};
      if (scopeKey === 'row') return cellDesigns.byRow[hour] || {};
      return cellDesigns.byCol[col] || {};
    }
    function writeDesign(patch) {
      let bucket;
      let key;
      if (scopeKey === 'cell') { bucket = cellDesigns.byCell; key = cellDesignKey(col, hour); }
      else if (scopeKey === 'row') { bucket = cellDesigns.byRow; key = hour; }
      else { bucket = cellDesigns.byCol; key = col; }
      const cur = bucket[key] || {};
      const next = Object.assign({}, cur, patch);
      // 빈 값 제거
      Object.keys(next).forEach(k => { if (next[k] === '' || next[k] == null || next[k] === false) delete next[k]; });
      if (Object.keys(next).length === 0) delete bucket[key];
      else bucket[key] = next;
      saveCellDesigns();
      wkRerender();
    }
    function resetCurrent() {
      if (scopeKey === 'cell') delete cellDesigns.byCell[cellDesignKey(col, hour)];
      else if (scopeKey === 'row') delete cellDesigns.byRow[hour];
      else delete cellDesigns.byCol[col];
      saveCellDesigns();
      renderPanel();
      wkRerender();
    }
    const dayNames = ['월','화','수','목','금','토','일'];
    const panel = document.createElement('div');
    panel.className = 'design-panel';
    designPanelEl = panel;

    function renderPanel() {
      const d = readDesign();
      panel.innerHTML = `
        <h4>셀 디자인</h4>
        <div class="design-panel-target">
          <button data-s="cell" class="${scopeKey==='cell'?'active':''}">이 셀</button>
          <button data-s="row" class="${scopeKey==='row'?'active':''}">${hour}시 행</button>
          <button data-s="col" class="${scopeKey==='col'?'active':''}">${dayNames[col]}요일 열</button>
        </div>
        <div class="dp-row">
          <label>배경</label>
          <input type="color" data-k="bg" value="${d.bg || '#ffffff'}">
          <button class="dp-clear" data-k="bg" title="제거">✕</button>
        </div>
        <div class="dp-row">
          <label>글씨색</label>
          <input type="color" data-k="fg" value="${d.fg || '#222222'}">
          <button class="dp-clear" data-k="fg" title="제거">✕</button>
        </div>
        <div class="dp-toggles">
          <div class="dp-toggle ${d.bold?'active':''}" data-tog="bold" style="font-weight:700;">B</div>
          <div class="dp-toggle ${d.italic?'active':''}" data-tog="italic" style="font-style:italic;">I</div>
        </div>
        <div class="dp-row">
          <label>폰트</label>
          <select data-k="fontFamily">
            <option value="">기본</option>
            <option value="'Gamja Flower', cursive" ${d.fontFamily==="'Gamja Flower', cursive"?'selected':''}>감자꽃</option>
            <option value="'Nanum Pen Script', cursive" ${d.fontFamily==="'Nanum Pen Script', cursive"?'selected':''}>나눔펜</option>
            <option value="'Gaegu', cursive" ${d.fontFamily==="'Gaegu', cursive"?'selected':''}>개구</option>
            <option value="'Malgun Gothic', sans-serif" ${d.fontFamily==="'Malgun Gothic', sans-serif"?'selected':''}>맑은 고딕</option>
          </select>
        </div>
        <div class="dp-row">
          <label>정렬</label>
          <select data-k="align">
            <option value="">가운데</option>
            <option value="left" ${d.align==='left'?'selected':''}>왼쪽</option>
            <option value="right" ${d.align==='right'?'selected':''}>오른쪽</option>
          </select>
        </div>
        <div class="dp-buttons">
          <button class="dp-reset">초기화</button>
          <button class="dp-close primary" style="background:#2874e0;color:#fff;border-color:#2874e0;">닫기</button>
        </div>
      `;
      panel.querySelectorAll('.design-panel-target button').forEach(b => {
        b.onclick = () => { scopeKey = b.dataset.s; renderPanel(); };
      });
      panel.querySelectorAll('input[type="color"]').forEach(inp => {
        inp.oninput = () => writeDesign({ [inp.dataset.k]: inp.value });
      });
      panel.querySelectorAll('.dp-clear').forEach(b => {
        b.onclick = () => writeDesign({ [b.dataset.k]: '' });
      });
      panel.querySelectorAll('.dp-toggle').forEach(t => {
        t.onclick = () => {
          const cur = readDesign();
          writeDesign({ [t.dataset.tog]: !cur[t.dataset.tog] });
        };
      });
      panel.querySelectorAll('select').forEach(s => {
        s.onchange = () => writeDesign({ [s.dataset.k]: s.value });
      });
      panel.querySelector('.dp-reset').onclick = resetCurrent;
      panel.querySelector('.dp-close').onclick = closeDesignPanel;
    }
    renderPanel();
    document.body.appendChild(panel);
    // 위치 조정
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const fx = Math.min(x, window.innerWidth - w - 10);
    const fy = Math.min(y, window.innerHeight - h - 10);
    panel.style.left = fx + 'px';
    panel.style.top = fy + 'px';
  }

  function closeDesignPanel() {
    if (designPanelEl) { designPanelEl.remove(); designPanelEl = null; }
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.design-panel') && !e.target.closest('.wk') && designPanelEl) {
      closeDesignPanel();
    }
  });

  // ─── 엑셀 스타일 셀 편집 시스템 ─────────────────────────
  let wkCells = [];
  let wkActive = null;
  let wkEditing = false;
  let wkDragStart = null;
  let wkDragEnd = null;
  let wkDragging = false;
  let wkClipboard = [];

  function wkCellAt(r, c) { return wkCells.find(x => x.row === r && x.col === c); }
  function wkSelected() {
    if (!wkDragStart) return [];
    const e = wkDragEnd || wkDragStart;
    const r1 = Math.min(wkDragStart.row, e.row), r2 = Math.max(wkDragStart.row, e.row);
    const c1 = Math.min(wkDragStart.col, e.col), c2 = Math.max(wkDragStart.col, e.col);
    return wkCells.filter(x => x.row >= r1 && x.row <= r2 && x.col >= c1 && x.col <= c2);
  }
  function wkHighlight() {
    wkCells.forEach(x => x.cell.classList.remove('selected', 'range-sel'));
    wkSelected().forEach(x => x.cell.classList.add('range-sel'));
    if (wkActive) { const a = wkCellAt(wkActive.row, wkActive.col); if (a) a.cell.classList.add('selected'); }
  }
  function wkSaveCell(dk, hour, text) {
    if (!events[dk]) events[dk] = [];
    const tag = `(${hour}:00)`;
    const matchIdx = (e) => {
      if (typeof e === 'object' && e && e.tt) { return (e.t||'').includes(tag); }
      if (typeof e === 'string') { return e.includes(tag); } // legacy 정리
      return false;
    };
    const oi = events[dk].findIndex(matchIdx);
    if (text) {
      const nt = text + tag;
      const obj = { t: nt, tt: true };
      if (oi >= 0) events[dk][oi] = obj; else events[dk].push(obj);
    } else if (oi >= 0) {
      events[dk].splice(oi, 1);
      if (events[dk].length === 0) delete events[dk];
    }
  }
  function wkGetText(dk, hour) {
    const tag = `(${hour}:00)`;
    const item = (events[dk]||[]).find(e => {
      if (typeof e === 'object' && e && e.tt) { return (e.t||'').includes(tag); }
      // legacy: 마이그레이션 누락된 옛 string 형식도 일단 읽음
      if (typeof e === 'string') { return e.includes(tag); }
      return false;
    });
    if (!item) return '';
    const t = typeof item === 'string' ? item : (item.t || '');
    return t.replace(/\(\d{1,2}:\d{2}\)/,'').trim();
  }
  function wkRerender() {
    const pos = wkActive ? {...wkActive} : null;
    const ds = wkDragStart ? {...wkDragStart} : null;
    const de = wkDragEnd ? {...wkDragEnd} : null;
    render();
    if (pos) { wkActive = pos; wkDragStart = ds; wkDragEnd = de; wkHighlight(); }
  }
  function wkStartEdit(info) {
    wkStopEdit();
    wkActive = { row: info.row, col: info.col };
    wkEditing = true;
    const cell = info.cell;
    const cur = wkGetText(info.dk, info.hour);
    cell.textContent = '';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'cell-input'; inp.value = cur;
    cell.appendChild(inp);
    inp.focus();
    inp.onblur = () => { if (wkEditing) wkCommitEdit(info, inp.value); };
    inp.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); wkCommitEdit(info, inp.value); wkMove(1, 0); }
      else if (e.key === 'Tab') { e.preventDefault(); wkCommitEdit(info, inp.value); wkMove(0, e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { wkCommitEdit(info, cur); }
      e.stopPropagation();
    };
  }
  function wkStopEdit() {
    if (!wkEditing) return;
    const inp = document.querySelector('.wk .cell-input');
    if (inp) { const p = inp.parentElement; const info = wkCells.find(x => x.cell === p); if (info) wkCommitEdit(info, inp.value); }
    wkEditing = false;
  }
  function wkCommitEdit(info, val) {
    wkEditing = false;
    const text = val ? val.trim() : '';
    // 다중 선택 상태면 선택된 셀 전부에 입력
    const sel = wkSelected();
    if (sel.length > 1) {
      sel.forEach(s => wkSaveCell(s.dk, s.hour, text));
    } else {
      wkSaveCell(info.dk, info.hour, text);
    }
    saveEvents();
    wkRerender();
  }
  function wkMove(dr, dc) {
    if (!wkActive) return;
    const nr = wkActive.row + dr, nc = wkActive.col + dc;
    const next = wkCellAt(nr, nc);
    if (next) { wkDragStart = {row:nr,col:nc}; wkDragEnd = null; wkStartEdit(next); wkHighlight(); }
  }

  function setupFreeCell(cell, dk, hour, existing, row, col) {
    cell.dataset.dk = dk; cell.dataset.hour = hour;
    wkCells.push({ cell, dk, hour, row, col });

    // 사용자 디자인 적용 (열=col 인덱스, 시간=hour)
    applyCellDesign(cell, getCellDesign(col, hour));

    if (cellDesignMode) {
      cell.classList.add('design-edit');
      cell.onmousedown = null;
      cell.onmouseenter = null;
      cell.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        openDesignPanel('cell', col, hour, e.clientX + 6, e.clientY + 6);
      };
      return;
    }
    if (pencilMode) {
      cell.onmousedown = (e) => { e.preventDefault(); pencilDragging = true; pencilCells = [cell]; cell.classList.add('pencil-hover'); };
      cell.onmouseenter = () => { if (pencilDragging) { pencilCells.push(cell); cell.classList.add('pencil-hover'); } };
      return;
    }
    cell.onmousedown = (e) => {
      if (e.target.tagName === 'INPUT') return;
      e.preventDefault();
      wkStopEdit();
      wkDragStart = {row,col}; wkDragEnd = null; wkActive = {row,col}; wkDragging = true;
      wkHighlight();
    };
    cell.onmouseenter = () => { if (wkDragging) { wkDragEnd = {row,col}; wkHighlight(); } };
  }

  document.addEventListener('mouseup', () => {
    if (pencilMode && pencilDragging) {
      pencilCells.forEach(cell => { const dk = cell.dataset.dk; const h = parseInt(cell.dataset.hour); if (dk && !isNaN(h)) wkSaveCell(dk, h, pencilText); });
      saveEvents(); pencilDragging = false; pencilCells = []; render(); return;
    }
    wkDragging = false;
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.target.tagName === 'INPUT' && e.target.className !== 'cell-input') return;
    if (e.target.className === 'cell-input') return; // cell-input은 자체 keydown에서 처리
    if (viewMode !== 'timetable' || !wkActive) return;

    // Ctrl+C
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      const sel = wkSelected(); if (!sel.length) return;
      const rows = [...new Set(sel.map(x=>x.row))].sort((a,b)=>a-b);
      const cols = [...new Set(sel.map(x=>x.col))].sort((a,b)=>a-b);
      wkClipboard = rows.map(r => cols.map(c => { const s = sel.find(x=>x.row===r&&x.col===c); return s ? wkGetText(s.dk,s.hour) : ''; }));
      e.preventDefault(); return;
    }
    // Ctrl+V
    if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) {
      if (!wkClipboard.length || !wkActive) return;
      wkClipboard.forEach((rd,ri) => { rd.forEach((text,ci) => { const info = wkCellAt(wkActive.row+ri, wkActive.col+ci); if (info) wkSaveCell(info.dk, info.hour, text); }); });
      saveEvents(); wkRerender(); e.preventDefault(); return;
    }
    // Delete/Backspace
    if (e.key === 'Delete' || e.key === 'Backspace') {
      const sel = wkSelected();
      const toClear = new Set();
      sel.forEach(info => { const t = wkGetText(info.dk, info.hour); if (t) { wkCells.filter(c=>c.col===info.col).forEach(c => { if (wkGetText(c.dk,c.hour)===t) toClear.add(c); }); } });
      (toClear.size > 0 ? toClear : sel).forEach(info => wkSaveCell(info.dk, info.hour, ''));
      saveEvents(); wkRerender(); e.preventDefault(); return;
    }
    // 화살표
    if (e.key === 'ArrowDown') { e.preventDefault(); wkActive.row++; wkDragStart={...wkActive}; wkDragEnd=null; wkHighlight(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); wkActive.row--; wkDragStart={...wkActive}; wkDragEnd=null; wkHighlight(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); wkActive.col++; wkDragStart={...wkActive}; wkDragEnd=null; wkHighlight(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); wkActive.col--; wkDragStart={...wkActive}; wkDragEnd=null; wkHighlight(); return; }
    // Enter
    if (e.key === 'Enter') { const info = wkCellAt(wkActive.row, wkActive.col); if (info) wkStartEdit(info); e.preventDefault(); return; }
    // 일반 문자 → 바로 입력 (다중 선택이면 전체에 적용)
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
      const info = wkCellAt(wkActive.row, wkActive.col);
      if (info) {
        const sel = wkSelected();
        if (sel.length > 1) { sel.forEach(s => wkSaveCell(s.dk, s.hour, '')); }
        else { wkSaveCell(info.dk, info.hour, ''); }
        info.cell.textContent = '';
        wkStartEdit(info);
        const inp = info.cell.querySelector('.cell-input');
        if (inp) inp.value = e.key;
      }
      e.preventDefault();
    }
  });

  // ─── 테마 시스템 ──────────────────────────────────────
  const THEME_KEY = 'calendar-themes-v1';
  const THEME_KEYS = ['q','w','e','r'];
  let themes = [];
  try { themes = JSON.parse(localStorage.getItem(THEME_KEY) || '[]'); } catch (e) { themes = []; }
  if (!themes.length) {
    themes = [{ id: 'holidays', name: '공휴일', color: '#d33333', image: null }];
    localStorage.setItem(THEME_KEY, JSON.stringify(themes));
  }
  let activeFilter = null;
  function saveThemes() {
    localStorage.setItem(THEME_KEY, JSON.stringify(themes));
    if (typeof scheduleOwnedSharesRepublish === 'function') scheduleOwnedSharesRepublish();
  }

  // ─── 일별 위젯 템플릿 시스템 ─────────────────────────
  // 사용자가 정의하는 "날짜 셀에 표시할 위젯"의 모음. 위젯 종류:
  //   number  : 숫자 + 단위 (순공시간, 운동시간 등)
  //   line    : 한 줄 텍스트 (한줄일기)
  //   memo    : 여러 줄 텍스트
  //   check   : 체크리스트 (옵션들)
  //   rating  : ★ 1~5
  //   tags    : 짧은 단어 여러 개
  // 각 필드는 라벨/색/배경/폰트크기 디자인 가능, 템플릿은 적용 범위(전체/요일/기간/특정일) 가짐.
  const DAY_TPL_KEY = 'calendar-day-templates-v1';
  const DAY_VAL_KEY = 'calendar-day-widget-values-v1';
  let dayTemplates = [];
  let dayWidgetValues = {};
  try { dayTemplates = JSON.parse(localStorage.getItem(DAY_TPL_KEY) || '[]'); } catch (_) { dayTemplates = []; }
  try { dayWidgetValues = JSON.parse(localStorage.getItem(DAY_VAL_KEY) || '{}'); } catch (_) { dayWidgetValues = {}; }
  if (!Array.isArray(dayTemplates)) dayTemplates = [];
  if (!dayWidgetValues || typeof dayWidgetValues !== 'object') dayWidgetValues = {};

  function saveDayTemplates() { localStorage.setItem(DAY_TPL_KEY, JSON.stringify(dayTemplates)); }
  function saveDayValues() { localStorage.setItem(DAY_VAL_KEY, JSON.stringify(dayWidgetValues)); }

  // 특정 날짜에 적용되는 템플릿 목록
  function getApplicableTemplates(dkStr) {
    if (!dkStr || !Array.isArray(dayTemplates)) return [];
    const [y, m, d] = dkStr.split('-').map(Number);
    if (!y) return [];
    const dt = new Date(y, m - 1, d);
    const dow = dt.getDay(); // 0=일 ... 6=토
    return dayTemplates.filter(tpl => {
      if (!tpl || tpl.enabled === false) return false;
      const sc = tpl.scope || { mode: 'all' };
      if (sc.mode === 'all') return true;
      if (sc.mode === 'weekdays') return Array.isArray(sc.weekdays) && sc.weekdays.includes(dow);
      if (sc.mode === 'range') {
        if (!sc.start || !sc.end) return false;
        return dkStr >= sc.start && dkStr <= sc.end;
      }
      if (sc.mode === 'days') return Array.isArray(sc.days) && sc.days.includes(dkStr);
      return false;
    });
  }

  function getFieldValue(dk, tplId, fieldId) {
    return dayWidgetValues[dk] && dayWidgetValues[dk][tplId] && dayWidgetValues[dk][tplId][fieldId];
  }
  function setFieldValue(dk, tplId, fieldId, v) {
    if (!dayWidgetValues[dk]) dayWidgetValues[dk] = {};
    if (!dayWidgetValues[dk][tplId]) dayWidgetValues[dk][tplId] = {};
    if (v === '' || v == null || (Array.isArray(v) && v.length === 0)) {
      delete dayWidgetValues[dk][tplId][fieldId];
      if (Object.keys(dayWidgetValues[dk][tplId]).length === 0) delete dayWidgetValues[dk][tplId];
      if (Object.keys(dayWidgetValues[dk]).length === 0) delete dayWidgetValues[dk];
    } else {
      dayWidgetValues[dk][tplId][fieldId] = v;
    }
    saveDayValues();
  }

  // 셀에 위젯들 렌더 (읽기 모드 + 클릭 시 인라인 편집)
  function renderDayWidgets(cell, dk) {
    const tpls = getApplicableTemplates(dk);
    if (tpls.length === 0) return;
    const box = document.createElement('div');
    box.className = 'day-widget-box';
    tpls.forEach(tpl => {
      (tpl.fields || []).forEach(f => {
        const el = renderWidget(dk, tpl, f);
        if (el) box.appendChild(el);
      });
    });
    if (box.children.length > 0) cell.appendChild(box);
  }

  function renderWidget(dk, tpl, f) {
    const d = f.design || {};
    const wrap = document.createElement('div');
    wrap.className = 'day-widget';
    if (d.bg) wrap.style.background = d.bg;
    if (d.fontFamily) wrap.style.fontFamily = d.fontFamily;
    if (d.fontSize === 'small') wrap.style.fontSize = '0.92em';
    else if (d.fontSize === 'large') wrap.style.fontSize = '1.12em';

    if (f.label && f.showLabel !== false) {
      const lab = document.createElement('span');
      lab.className = 'dw-label';
      lab.textContent = f.label + ':';
      if (d.labelColor) lab.style.color = d.labelColor;
      wrap.appendChild(lab);
    }
    const val = document.createElement('span');
    val.className = 'dw-val';
    if (d.color) val.style.color = d.color;

    const v = getFieldValue(dk, tpl.id, f.id);
    const has = !(v === undefined || v === null || v === '' ||
                  (Array.isArray(v) && v.length === 0) ||
                  (typeof v === 'object' && Object.keys(v).length === 0));

    if (f.type === 'number') {
      val.textContent = has ? (String(v) + (f.unit ? ' ' + f.unit : '')) : '—';
    } else if (f.type === 'line' || f.type === 'memo') {
      val.textContent = has ? String(v) : '비어있음';
      if (f.type === 'memo') { val.style.whiteSpace = 'normal'; val.style.overflow = 'visible'; }
    } else if (f.type === 'rating') {
      val.className = 'dw-val day-widget-rating';
      const max = parseInt(f.max) || 5;
      const cur = parseInt(v) || 0;
      let s = '';
      for (let i = 0; i < max; i++) s += i < cur ? '★' : '☆';
      val.textContent = s;
    } else if (f.type === 'tags') {
      val.className = 'dw-val day-widget-tags';
      val.innerHTML = '';
      if (has && Array.isArray(v)) {
        v.forEach(t => {
          const c = document.createElement('span'); c.className = 'tag-chip'; c.textContent = t;
          val.appendChild(c);
        });
      } else { val.textContent = '—'; }
    } else if (f.type === 'check') {
      val.className = 'dw-val day-widget-check';
      val.innerHTML = '';
      const opts = Array.isArray(f.options) ? f.options : [];
      const state = (typeof v === 'object' && v) ? v : {};
      opts.forEach(opt => {
        const it = document.createElement('span');
        it.className = 'ck-item' + (state[opt] ? ' on' : '');
        const cb = document.createElement('span'); cb.className = 'ck-box';
        it.appendChild(cb);
        it.appendChild(document.createTextNode(opt));
        it.onclick = (e) => {
          e.stopPropagation();
          const cur = Object.assign({}, getFieldValue(dk, tpl.id, f.id) || {});
          cur[opt] = !cur[opt];
          setFieldValue(dk, tpl.id, f.id, cur);
          render();
        };
        val.appendChild(it);
      });
      if (opts.length === 0) val.textContent = '(옵션 없음)';
    }

    if (!has && f.type !== 'check' && f.type !== 'tags') wrap.classList.add('is-empty');

    wrap.appendChild(val);

    // 체크리스트는 항목별 토글 → wrap 자체에는 편집기 부여 안 함.
    // 그 외에는 클릭 시 인라인 편집.
    if (f.type !== 'check') {
      wrap.onclick = (e) => {
        e.stopPropagation();
        startWidgetEdit(wrap, dk, tpl.id, f);
      };
    } else {
      wrap.onclick = (e) => e.stopPropagation();
    }
    return wrap;
  }

  function startWidgetEdit(wrap, dk, tplId, f) {
    const cur = getFieldValue(dk, tplId, f.id);
    const valEl = wrap.querySelector('.dw-val');
    if (!valEl) return;

    function commit(newVal) {
      setFieldValue(dk, tplId, f.id, newVal);
      render();
    }
    function cancel() { render(); }

    if (f.type === 'number') {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.className = 'day-widget-edit';
      inp.step = 'any'; inp.value = (cur != null ? cur : '');
      valEl.innerHTML = ''; valEl.appendChild(inp);
      inp.focus(); inp.select();
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(inp.value.trim()); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        e.stopPropagation();
      };
      inp.onblur = () => commit(inp.value.trim());
    } else if (f.type === 'line') {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'day-widget-edit';
      inp.value = cur || '';
      valEl.innerHTML = ''; valEl.appendChild(inp);
      inp.focus(); inp.select();
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(inp.value); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        e.stopPropagation();
      };
      inp.onblur = () => commit(inp.value);
    } else if (f.type === 'memo') {
      const ta = document.createElement('textarea');
      ta.className = 'day-widget-edit'; ta.rows = 3;
      ta.value = cur || '';
      valEl.innerHTML = ''; valEl.appendChild(ta);
      ta.focus();
      ta.onkeydown = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(ta.value); }
        e.stopPropagation();
      };
      ta.onblur = () => commit(ta.value);
    } else if (f.type === 'rating') {
      const max = parseInt(f.max) || 5;
      const cont = document.createElement('span');
      cont.style.cursor = 'pointer'; cont.style.userSelect = 'none';
      let curRating = parseInt(cur) || 0;
      function paint(rating) {
        cont.innerHTML = '';
        for (let i = 1; i <= max; i++) {
          const s = document.createElement('span');
          s.textContent = i <= rating ? '★' : '☆';
          s.style.cursor = 'pointer';
          s.onmouseenter = () => paint(i);
          s.onmouseleave = () => paint(curRating);
          s.onclick = (e) => {
            e.stopPropagation();
            const newR = (curRating === i) ? 0 : i;
            commit(newR);
          };
          cont.appendChild(s);
        }
      }
      paint(curRating);
      valEl.innerHTML = ''; valEl.appendChild(cont);
      // 바깥 클릭 시 종료
      setTimeout(() => {
        const off = (ev) => {
          if (!cont.contains(ev.target)) { document.removeEventListener('click', off, true); render(); }
        };
        document.addEventListener('click', off, true);
      }, 0);
    } else if (f.type === 'tags') {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'day-widget-edit';
      inp.value = Array.isArray(cur) ? cur.join(', ') : '';
      inp.placeholder = '쉼표 또는 공백으로 구분';
      valEl.innerHTML = ''; valEl.appendChild(inp);
      inp.focus(); inp.select();
      const apply = () => {
        const parts = inp.value.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
        commit(parts);
      };
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); apply(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        e.stopPropagation();
      };
      inp.onblur = apply;
    }
  }

  // ─── 일별 위젯 입력 모달 (날짜 클릭 → 위젯 입력) ──────────────────────────
  function openDayWidgetModal(dk) {
    const tpls = getApplicableTemplates(dk);
    const backdrop = document.getElementById('day-widget-input-backdrop');
    const titleEl  = document.getElementById('day-widget-input-title');
    const body     = document.getElementById('day-widget-input-body');

    titleEl.textContent = '📊 위젯 입력 — ' + dk;
    body.innerHTML = '';

    if (tpls.length === 0) {
      body.innerHTML =
        '<div style="text-align:center;color:#888;padding:20px 0;">' +
          '이 날짜에 적용된 위젯 템플릿이 없어요.<br>' +
          '<button id="dwi-goto" style="margin-top:14px;padding:8px 18px;' +
            'background:#2874e0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;">' +
            '위젯 설정 열기</button>' +
        '</div>';
      backdrop.classList.add('active');
      document.getElementById('dwi-goto').onclick = () => { closeDayWidgetModal(); openDayTplManager(); };
      return;
    }

    tpls.forEach(tpl => {
      const sec = document.createElement('div');
      sec.style.cssText = 'margin-bottom:20px;';
      const hd = document.createElement('div');
      hd.style.cssText = 'font-weight:600;font-size:0.92em;color:var(--text-light);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);';
      hd.textContent = tpl.name;
      sec.appendChild(hd);

      (tpl.fields || []).forEach(f => {
        const row = document.createElement('div');
        row.style.cssText = 'margin-bottom:10px;';
        if (f.label && f.showLabel !== false) {
          const lbl = document.createElement('label');
          lbl.style.cssText = 'display:block;font-size:0.88em;font-weight:500;color:#555;margin-bottom:4px;';
          lbl.textContent = f.label;
          row.appendChild(lbl);
        }
        const cur = getFieldValue(dk, tpl.id, f.id);
        const inputStyle = 'width:100%;padding:8px 10px;border:1px solid #d0d0d5;border-radius:6px;font-size:1em;font-family:inherit;box-sizing:border-box;';

        if (f.type === 'number') {
          const inp = document.createElement('input');
          inp.type = 'number'; inp.style.cssText = inputStyle;
          inp.value = cur != null ? cur : '';
          inp.placeholder = f.unit || '';
          inp.oninput = () => setFieldValue(dk, tpl.id, f.id, inp.value.trim());
          row.appendChild(inp);

        } else if (f.type === 'line') {
          const inp = document.createElement('input');
          inp.type = 'text'; inp.style.cssText = inputStyle;
          inp.value = cur || '';
          inp.oninput = () => setFieldValue(dk, tpl.id, f.id, inp.value);
          row.appendChild(inp);

        } else if (f.type === 'memo') {
          const ta = document.createElement('textarea');
          ta.style.cssText = inputStyle + 'resize:vertical;';
          ta.rows = 3; ta.value = cur || '';
          ta.oninput = () => setFieldValue(dk, tpl.id, f.id, ta.value);
          row.appendChild(ta);

        } else if (f.type === 'rating') {
          const max = parseInt(f.max) || 5;
          let curRating = parseInt(cur) || 0;
          const cont = document.createElement('div');
          cont.style.cssText = 'display:flex;gap:6px;font-size:1.8em;cursor:pointer;';
          function paintR(v) {
            cont.innerHTML = '';
            for (let i = 1; i <= max; i++) {
              const s = document.createElement('span');
              s.textContent = i <= v ? '★' : '☆';
              s.style.color = i <= v ? '#f0c040' : '#ccc';
              s.onmouseenter = () => paintR(i);
              s.onmouseleave = () => paintR(curRating);
              s.onclick = () => { curRating = (curRating === i) ? 0 : i; setFieldValue(dk, tpl.id, f.id, curRating); paintR(curRating); };
              cont.appendChild(s);
            }
          }
          paintR(curRating);
          row.appendChild(cont);

        } else if (f.type === 'tags') {
          const inp = document.createElement('input');
          inp.type = 'text'; inp.style.cssText = inputStyle;
          inp.value = Array.isArray(cur) ? cur.join(', ') : '';
          inp.placeholder = '쉼표로 구분 (예: 수학, 영어)';
          const saveT = () => {
            const parts = inp.value.split(/,/).map(s => s.trim()).filter(Boolean);
            setFieldValue(dk, tpl.id, f.id, parts);
          };
          inp.oninput = saveT;
          row.appendChild(inp);

        } else if (f.type === 'check') {
          const opts = Array.isArray(f.options) ? f.options : [];
          const state = (typeof cur === 'object' && cur) ? cur : {};
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
          opts.forEach(opt => {
            const lbl2 = document.createElement('label');
            lbl2.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;border:1px solid #d0d0d5;border-radius:6px;font-size:0.9em;user-select:none;';
            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.checked = !!state[opt];
            cb.onchange = () => {
              const v = Object.assign({}, getFieldValue(dk, tpl.id, f.id) || {});
              v[opt] = cb.checked;
              setFieldValue(dk, tpl.id, f.id, v);
            };
            lbl2.appendChild(cb);
            lbl2.appendChild(document.createTextNode(opt));
            wrap.appendChild(lbl2);
          });
          row.appendChild(wrap);
        }
        sec.appendChild(row);
      });
      body.appendChild(sec);
    });

    backdrop.classList.add('active');
  }

  function closeDayWidgetModal() {
    document.getElementById('day-widget-input-backdrop').classList.remove('active');
    render();
  }

  document.getElementById('day-widget-input-close').onclick = closeDayWidgetModal;
  document.getElementById('day-widget-input-backdrop').onclick = (e) => {
    if (e.target === document.getElementById('day-widget-input-backdrop')) closeDayWidgetModal();
  };

  // ─── 일별 위젯 템플릿 모달 ──────────────────────────
  const dayTplModal = document.getElementById('day-tpl-modal-backdrop');
  const dayTplEditor = document.getElementById('day-tpl-editor-backdrop');
  let editingDayTpl = null; // 편집 중 사본

  function openDayTplManager() {
    renderDayTplList();
    dayTplModal.classList.add('active');
  }
  function closeDayTplManager() { dayTplModal.classList.remove('active'); }

  function renderDayTplList() {
    const list = document.getElementById('day-tpl-list');
    list.innerHTML = '';
    if (dayTemplates.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:#888;padding:24px;">템플릿이 없습니다.<br>"+ 새 템플릿" 으로 만들어보세요 (예: 순공시간 / 한줄일기 / 과목 체크).</div>';
      return;
    }
    dayTemplates.forEach((tpl, idx) => {
      const card = document.createElement('div');
      card.className = 'day-tpl-card' + (tpl.enabled !== false ? ' enabled' : '');
      const info = document.createElement('div');
      info.className = 'tc-info';
      const nm = document.createElement('div');
      nm.className = 'tc-name';
      nm.textContent = tpl.name || '(이름 없음)';
      info.appendChild(nm);
      const meta = document.createElement('div');
      meta.className = 'tc-meta';
      meta.innerHTML = `<span>위젯 ${tpl.fields ? tpl.fields.length : 0}개</span>` +
                      `<span>${scopeText(tpl.scope)}</span>`;
      info.appendChild(meta);
      const toggle = document.createElement('div');
      toggle.className = 'tc-toggle';
      toggle.title = (tpl.enabled !== false) ? '비활성화' : '활성화';
      toggle.onclick = () => {
        tpl.enabled = (tpl.enabled === false);
        saveDayTemplates();
        renderDayTplList();
        render();
      };
      const edit = document.createElement('button');
      edit.className = 'tc-edit'; edit.textContent = '편집';
      edit.onclick = () => openDayTplEditor(idx);
      const del = document.createElement('button');
      del.className = 'tc-del'; del.textContent = '삭제';
      del.onclick = () => {
        if (!confirm(`"${tpl.name}" 템플릿을 삭제할까요?\n(입력한 값들은 보존됩니다)`)) return;
        dayTemplates.splice(idx, 1);
        saveDayTemplates();
        renderDayTplList();
        render();
      };
      card.appendChild(info);
      card.appendChild(toggle);
      card.appendChild(edit);
      card.appendChild(del);
      list.appendChild(card);
    });
  }

  function scopeText(sc) {
    if (!sc) return '전체 날짜';
    if (sc.mode === 'all') return '전체 날짜';
    if (sc.mode === 'weekdays') {
      const N = ['일','월','화','수','목','금','토'];
      return '요일: ' + (sc.weekdays || []).slice().sort().map(i => N[i]).join('·');
    }
    if (sc.mode === 'range') return `기간: ${sc.start || '?'} ~ ${sc.end || '?'}`;
    if (sc.mode === 'days') return `특정 날짜 ${(sc.days || []).length}일`;
    return '';
  }

  function openDayTplEditor(idx) {
    if (idx == null) {
      editingDayTpl = {
        id: 'tpl_' + Date.now().toString(36),
        name: '새 템플릿', enabled: true,
        fields: [],
        scope: { mode: 'all' },
        __isNew: true
      };
    } else {
      editingDayTpl = JSON.parse(JSON.stringify(dayTemplates[idx]));
      editingDayTpl.__idx = idx;
    }
    document.getElementById('day-tpl-editor-title').textContent =
      editingDayTpl.__isNew ? '템플릿 만들기' : '템플릿 편집';
    document.getElementById('day-tpl-editor-del').style.display =
      editingDayTpl.__isNew ? 'none' : '';
    document.getElementById('day-tpl-name').value = editingDayTpl.name || '';
    renderTplFields();
    renderTplScope();
    dayTplEditor.classList.add('active');
    setTimeout(() => document.getElementById('day-tpl-name').focus(), 50);
  }
  function closeDayTplEditor() {
    dayTplEditor.classList.remove('active');
    editingDayTpl = null;
  }

  function renderTplFields() {
    const box = document.getElementById('day-tpl-fields');
    box.innerHTML = '';
    if (!editingDayTpl.fields || editingDayTpl.fields.length === 0) {
      box.innerHTML = '<div style="color:#888;text-align:center;padding:14px;font-size:0.85em;">아래 버튼으로 위젯을 추가하세요</div>';
      return;
    }
    editingDayTpl.fields.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'day-tpl-field';
      const head = document.createElement('div');
      head.className = 'day-tpl-field-head';
      const typeLabel = document.createElement('span');
      typeLabel.className = 'fh-type';
      typeLabel.textContent = fieldTypeName(f.type);
      const labelInp = document.createElement('input');
      labelInp.type = 'text'; labelInp.className = 'fh-label';
      labelInp.value = f.label || ''; labelInp.placeholder = '라벨 (예: 순공시간)';
      labelInp.oninput = () => { f.label = labelInp.value; };
      const upBtn = document.createElement('button');
      upBtn.className = 'fh-del'; upBtn.textContent = '↑'; upBtn.title = '위로';
      upBtn.style.color = '#888';
      upBtn.disabled = (i === 0);
      upBtn.onclick = () => {
        if (i === 0) return;
        [editingDayTpl.fields[i-1], editingDayTpl.fields[i]] = [editingDayTpl.fields[i], editingDayTpl.fields[i-1]];
        renderTplFields();
      };
      const dnBtn = document.createElement('button');
      dnBtn.className = 'fh-del'; dnBtn.textContent = '↓'; dnBtn.title = '아래로';
      dnBtn.style.color = '#888';
      dnBtn.disabled = (i === editingDayTpl.fields.length - 1);
      dnBtn.onclick = () => {
        if (i >= editingDayTpl.fields.length - 1) return;
        [editingDayTpl.fields[i+1], editingDayTpl.fields[i]] = [editingDayTpl.fields[i], editingDayTpl.fields[i+1]];
        renderTplFields();
      };
      const delBtn = document.createElement('button');
      delBtn.className = 'fh-del'; delBtn.textContent = '✕'; delBtn.title = '삭제';
      delBtn.onclick = () => { editingDayTpl.fields.splice(i, 1); renderTplFields(); };
      head.appendChild(typeLabel);
      head.appendChild(labelInp);
      head.appendChild(upBtn);
      head.appendChild(dnBtn);
      head.appendChild(delBtn);
      card.appendChild(head);

      // 본체: 타입별 옵션 + 디자인 (라벨색/값색/배경/폰트크기)
      const body = document.createElement('div');
      body.className = 'day-tpl-field-body';
      if (f.type === 'number') {
        body.appendChild(makeLabel('단위'));
        const u = document.createElement('input'); u.type = 'text';
        u.value = f.unit || ''; u.placeholder = '시간';
        u.oninput = () => { f.unit = u.value; };
        body.appendChild(u);
      } else if (f.type === 'check') {
        body.appendChild(makeLabel('항목(쉼표)'));
        const o = document.createElement('input'); o.type = 'text'; o.className = 'opt-input';
        o.value = (f.options || []).join(', '); o.placeholder = '국어, 영어, 수학';
        o.oninput = () => {
          f.options = o.value.split(',').map(s => s.trim()).filter(Boolean);
        };
        body.appendChild(o);
      } else if (f.type === 'rating') {
        body.appendChild(makeLabel('최대'));
        const m = document.createElement('input'); m.type = 'number';
        m.value = f.max || 5; m.min = 1; m.max = 10; m.style.width = '60px';
        m.oninput = () => { f.max = parseInt(m.value) || 5; };
        body.appendChild(m);
      }
      // 디자인 옵션 (공통)
      f.design = f.design || {};
      body.appendChild(makeLabel('라벨색'));
      const lc = document.createElement('input'); lc.type = 'color';
      lc.value = f.design.labelColor || '#555555';
      lc.oninput = () => { f.design.labelColor = lc.value; };
      body.appendChild(lc);
      body.appendChild(makeLabel('값색'));
      const vc = document.createElement('input'); vc.type = 'color';
      vc.value = f.design.color || '#222222';
      vc.oninput = () => { f.design.color = vc.value; };
      body.appendChild(vc);
      body.appendChild(makeLabel('배경'));
      const bg = document.createElement('input'); bg.type = 'color';
      bg.value = f.design.bg || '#ffffff';
      bg.oninput = () => { f.design.bg = bg.value; };
      body.appendChild(bg);
      const bgClr = document.createElement('button');
      bgClr.textContent = '∅'; bgClr.title = '배경 제거';
      bgClr.style.cssText = 'border:1px solid var(--border);background:#fff;padding:2px 6px;border-radius:3px;cursor:pointer;font-size:0.8em;';
      bgClr.onclick = (e) => { e.preventDefault(); delete f.design.bg; renderTplFields(); };
      body.appendChild(bgClr);
      body.appendChild(makeLabel('크기'));
      const sz = document.createElement('select');
      ['small','normal','large'].forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s === 'small' ? '작게' : s === 'large' ? '크게' : '보통';
        if ((f.design.fontSize || 'normal') === s) opt.selected = true;
        sz.appendChild(opt);
      });
      sz.onchange = () => { f.design.fontSize = sz.value; };
      body.appendChild(sz);

      card.appendChild(body);
      box.appendChild(card);
    });
  }
  function makeLabel(t) {
    const s = document.createElement('span');
    s.textContent = t; s.style.fontSize = '0.78em'; s.style.color = '#888';
    return s;
  }
  function fieldTypeName(t) {
    return {number:'숫자', line:'한줄', memo:'메모', check:'체크', rating:'평점', tags:'태그'}[t] || t;
  }

  function renderTplScope() {
    const box = document.getElementById('day-tpl-scope');
    box.innerHTML = '';
    if (!editingDayTpl.scope) editingDayTpl.scope = { mode: 'all' };
    const sc = editingDayTpl.scope;

    // 모드 선택
    const modeRow = document.createElement('div');
    modeRow.className = 'day-tpl-scope-row';
    const modes = [['all','전체 날짜'],['weekdays','특정 요일'],['range','기간'],['days','선택한 날짜']];
    modes.forEach(([v, t]) => {
      const lab = document.createElement('label');
      lab.style.display = 'inline-flex'; lab.style.gap = '4px'; lab.style.alignItems = 'center';
      lab.style.marginRight = '12px'; lab.style.cursor = 'pointer';
      const rd = document.createElement('input');
      rd.type = 'radio'; rd.name = 'tpl-scope-mode'; rd.value = v;
      rd.checked = (sc.mode === v);
      rd.onchange = () => {
        sc.mode = v;
        if (v === 'weekdays' && !Array.isArray(sc.weekdays)) sc.weekdays = [1,2,3,4,5];
        if (v === 'days' && !Array.isArray(sc.days)) sc.days = [];
        renderTplScope();
      };
      lab.appendChild(rd);
      const sp = document.createElement('span'); sp.textContent = t;
      lab.appendChild(sp);
      modeRow.appendChild(lab);
    });
    box.appendChild(modeRow);

    // 모드별 입력
    if (sc.mode === 'weekdays') {
      const r = document.createElement('div'); r.className = 'day-tpl-scope-row';
      const lab = document.createElement('span'); lab.style.fontSize = '0.85em'; lab.textContent = '요일:';
      r.appendChild(lab);
      const wdBox = document.createElement('div'); wdBox.className = 'day-tpl-scope-wd';
      const NAMES = ['일','월','화','수','목','금','토'];
      NAMES.forEach((n, i) => {
        const w = document.createElement('div'); w.className = 'wd';
        if (sc.weekdays && sc.weekdays.includes(i)) w.classList.add('on');
        w.textContent = n;
        if (i === 0) w.style.color = '#d33';
        if (i === 6) w.style.color = '#36c';
        w.onclick = () => {
          sc.weekdays = sc.weekdays || [];
          if (sc.weekdays.includes(i)) sc.weekdays = sc.weekdays.filter(x => x !== i);
          else sc.weekdays.push(i);
          renderTplScope();
        };
        wdBox.appendChild(w);
      });
      r.appendChild(wdBox);
      box.appendChild(r);
    } else if (sc.mode === 'range') {
      const r = document.createElement('div'); r.className = 'day-tpl-scope-row';
      r.appendChild(makeLabel('시작'));
      const s = document.createElement('input'); s.type = 'date'; s.value = sc.start || '';
      s.onchange = () => { sc.start = s.value; };
      r.appendChild(s);
      r.appendChild(makeLabel('끝'));
      const e = document.createElement('input'); e.type = 'date'; e.value = sc.end || '';
      e.onchange = () => { sc.end = e.value; };
      r.appendChild(e);
      box.appendChild(r);
    } else if (sc.mode === 'days') {
      const r = document.createElement('div'); r.className = 'day-tpl-scope-row';
      r.appendChild(makeLabel('날짜 추가'));
      const inp = document.createElement('input'); inp.type = 'date';
      const addBtn = document.createElement('button'); addBtn.textContent = '+ 추가';
      addBtn.style.cssText = 'padding:4px 10px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;font-size:0.85em;';
      addBtn.onclick = () => {
        const v = inp.value;
        if (!v) return;
        sc.days = sc.days || [];
        if (!sc.days.includes(v)) sc.days.push(v);
        sc.days.sort();
        inp.value = '';
        renderTplScope();
      };
      r.appendChild(inp); r.appendChild(addBtn);
      box.appendChild(r);

      const daysWrap = document.createElement('div');
      daysWrap.className = 'day-tpl-scope-days';
      if (!sc.days || sc.days.length === 0) {
        const e = document.createElement('span'); e.className = 'dempty';
        e.textContent = '선택된 날짜가 없습니다';
        daysWrap.appendChild(e);
      } else {
        sc.days.forEach((d, di) => {
          const c = document.createElement('span'); c.className = 'dchip';
          c.textContent = d + ' ✕';
          c.title = '클릭해서 제거';
          c.onclick = () => { sc.days.splice(di, 1); renderTplScope(); };
          daysWrap.appendChild(c);
        });
      }
      box.appendChild(daysWrap);
    }
  }

  document.getElementById('day-tpl-mgr-btn').onclick = openDayTplManager;
  document.getElementById('day-tpl-close-btn').onclick = closeDayTplManager;
  dayTplModal.onclick = (e) => { if (e.target === dayTplModal) closeDayTplManager(); };
  document.getElementById('day-tpl-add-btn').onclick = () => openDayTplEditor(null);

  document.querySelectorAll('.day-tpl-add-field').forEach(btn => {
    btn.onclick = () => {
      if (!editingDayTpl) return;
      const t = btn.dataset.type;
      const defaultLabels = {
        number:'순공시간', line:'한줄일기', memo:'메모', check:'오늘 공부', rating:'컨디션', tags:'태그'
      };
      const f = {
        id: 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        type: t,
        label: defaultLabels[t] || '필드',
        design: {}
      };
      if (t === 'number') f.unit = '시간';
      if (t === 'check') f.options = ['국어','영어','수학'];
      if (t === 'rating') f.max = 5;
      editingDayTpl.fields.push(f);
      renderTplFields();
    };
  });

  document.getElementById('day-tpl-editor-cancel').onclick = closeDayTplEditor;
  dayTplEditor.onclick = (e) => { if (e.target === dayTplEditor) closeDayTplEditor(); };
  document.getElementById('day-tpl-editor-save').onclick = () => {
    if (!editingDayTpl) return;
    editingDayTpl.name = document.getElementById('day-tpl-name').value.trim() || '템플릿';
    const obj = Object.assign({}, editingDayTpl);
    delete obj.__isNew; delete obj.__idx;
    if (editingDayTpl.__isNew) {
      dayTemplates.push(obj);
    } else {
      dayTemplates[editingDayTpl.__idx] = obj;
    }
    saveDayTemplates();
    closeDayTplEditor();
    renderDayTplList();
    render();
  };
  document.getElementById('day-tpl-editor-del').onclick = () => {
    if (!editingDayTpl || editingDayTpl.__isNew) return;
    if (!confirm(`"${editingDayTpl.name}" 템플릿을 삭제할까요?`)) return;
    dayTemplates.splice(editingDayTpl.__idx, 1);
    saveDayTemplates();
    closeDayTplEditor();
    renderDayTplList();
    render();
  };

  // 멀티 테마 헬퍼: 일정 항목에서 테마 ID 배열 추출
  // 호환성: th 는 string('id'), array(['id1','id2']) 모두 가능
  function getEventThemeIds(item) {
    if (typeof item !== 'object' || !item) return [];
    if (Array.isArray(item.th)) return item.th.filter(Boolean);
    if (typeof item.th === 'string' && item.th) return [item.th];
    return [];
  }
  function getEventThemes(item) {
    return getEventThemeIds(item)
      .map(id => themes.find(t => t.id === id))
      .filter(Boolean);
  }
  function setEventThemes(item, ids) {
    if (typeof item !== 'object' || !item) return item;
    const clean = (ids || []).filter(Boolean);
    if (clean.length === 0) delete item.th;
    else if (clean.length === 1) item.th = clean[0];
    else item.th = clean;
    return item;
  }
  // 일정 텍스트 추출 (string 그대로 / object.t)
  function getEventText(item) {
    return typeof item === 'string' ? item : (item && item.t) || '';
  }

  // 일정 모달은 추가/편집 양쪽으로 쓰임. editing 객체로 컨텍스트 관리.
  // editing = null → 추가 모드
  // editing = { dk, idx } → 편집 모드 (events[dk][idx])
  let editingEvent = null;
  let modalSelectedThemes = new Set();

  function openModal(dateStr) {
    editingEvent = null;
    modalSelectedThemes = new Set();
    document.getElementById('modal-title').textContent = '일정 추가';
    document.getElementById('modal-del-btn').style.display = 'none';
    eventDateInput.value = dateStr || todayKey();
    eventDateInput.disabled = false;
    eventTextInput.value = '';
    renderThemeChecklist();
    modal.classList.add('active');
    setTimeout(() => eventTextInput.focus(), 100);
  }

  function openEditEventModal(dk, idx) {
    const item = events[dk] && events[dk][idx];
    if (!item) return;
    editingEvent = { dk, idx };
    modalSelectedThemes = new Set(getEventThemeIds(item));
    document.getElementById('modal-title').textContent = '일정 편집';
    const delBtn = document.getElementById('modal-del-btn');
    delBtn.style.display = '';
    eventDateInput.value = dk;
    eventDateInput.disabled = false;
    // 시간표 항목은 (HH:00) 태그가 붙어 있는데 편집창에서는 제거하지 않음 (보존)
    eventTextInput.value = getEventText(item);
    renderThemeChecklist();
    modal.classList.add('active');
    setTimeout(() => { eventTextInput.focus(); eventTextInput.select(); }, 100);
  }

  function renderThemeChecklist() {
    const box = document.getElementById('event-theme-list');
    box.innerHTML = '';
    // 구독 테마는 편집 시 추가 불가 (원본 사용자가 관리)
    const editable = themes.filter(t => t.share_role !== 'subscriber');
    if (editable.length === 0) {
      box.innerHTML = '<div class="theme-checklist-empty">테마가 없습니다. "테마 관리"에서 추가하세요.</div>';
      return;
    }
    editable.forEach(th => {
      const chip = document.createElement('div');
      chip.className = 'theme-chip' + (modalSelectedThemes.has(th.id) ? ' active' : '');
      chip.style.setProperty('--chip-color', th.color);
      chip.style.setProperty('--chip-bg', th.color + '22');
      if (th.image) {
        const img = document.createElement('img');
        img.className = 'chip-img';
        img.src = th.image;
        chip.appendChild(img);
      } else {
        const dot = document.createElement('span');
        dot.className = 'chip-dot';
        dot.style.background = th.color;
        chip.appendChild(dot);
      }
      const label = document.createElement('span');
      label.textContent = th.name;
      chip.appendChild(label);
      chip.onclick = () => {
        if (modalSelectedThemes.has(th.id)) modalSelectedThemes.delete(th.id);
        else modalSelectedThemes.add(th.id);
        renderThemeChecklist();
      };
      box.appendChild(chip);
    });
  }

  function closeModal() {
    modal.classList.remove('active');
    editingEvent = null;
  }

  // 날짜 클릭 시 액션 메뉴 (추가 / 일정 목록 / 별표 / 동그라미 등)
  const dayActionMenuEl = document.getElementById('day-action-menu');

  function hideDayActionMenu() {
    dayActionMenuEl.style.display = 'none';
    dayActionMenuEl.innerHTML = '';
  }

  function openDayActionMenu(x, y, dk) {
    hideContextMenu();
    dayActionMenuEl.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'dam-header';
    header.textContent = dk;
    dayActionMenuEl.appendChild(header);

    const addItem = document.createElement('div');
    addItem.className = 'dam-item';
    addItem.innerHTML = '<span class="dam-icon">＋</span><span>일정 추가</span>';
    addItem.onclick = () => { hideDayActionMenu(); openModal(dk); };
    dayActionMenuEl.appendChild(addItem);

    const sc = starred[dk] || 0;
    const starItem = document.createElement('div');
    starItem.className = 'dam-item';
    if (sc === 0) starItem.innerHTML = '<span class="dam-icon">☆</span><span>별표 표시</span>';
    else if (sc < 3) starItem.innerHTML = `<span class="dam-icon">☆</span><span>별표 추가 (${sc}/3)</span>`;
    else starItem.innerHTML = '<span class="dam-icon">★</span><span>별표 해제</span>';
    starItem.onclick = () => { hideDayActionMenu(); toggleStar(dk); };
    dayActionMenuEl.appendChild(starItem);

    // 동그라미 토글
    const circleItem = document.createElement('div');
    circleItem.className = 'dam-item';
    if (circlesData[dk]) circleItem.innerHTML = '<span class="dam-icon">○</span><span>동그라미 해제</span>';
    else circleItem.innerHTML = '<span class="dam-icon">○</span><span>동그라미 표시</span>';
    circleItem.onclick = () => {
      hideDayActionMenu();
      if (circlesData[dk]) delete circlesData[dk];
      else circlesData[dk] = true;
      saveCircles();
      render();
    };
    dayActionMenuEl.appendChild(circleItem);

    // 위젯 입력
    const widgetItem = document.createElement('div');
    widgetItem.className = 'dam-item';
    widgetItem.innerHTML = '<span class="dam-icon">📊</span><span>위젯 입력</span>';
    widgetItem.onclick = () => { hideDayActionMenu(); openDayWidgetModal(dk); };
    dayActionMenuEl.appendChild(widgetItem);

    // 이 날짜의 일정 목록 (편집·삭제)
    const dayEv = (events[dk] || []).filter(it => !isTimetableEvent(it));
    if (dayEv.length > 0) {
      const sectTitle = document.createElement('div');
      sectTitle.className = 'dam-section-title';
      sectTitle.textContent = `이 날의 일정 (${dayEv.length})`;
      dayActionMenuEl.appendChild(sectTitle);
      dayEv.forEach((item) => {
        // 원본 인덱스
        const originalIdx = (events[dk] || []).indexOf(item);
        const row = document.createElement('div');
        row.className = 'dam-event-row';
        const ths = getEventThemes(item);
        const stripe = document.createElement('div');
        stripe.className = 'dam-event-color';
        if (ths.length >= 2) {
          const stops = [];
          const n = ths.length;
          ths.forEach((t, i) => {
            const a = (i * 100 / n).toFixed(2) + '%';
            const b = ((i + 1) * 100 / n).toFixed(2) + '%';
            stops.push(`${t.color} ${a}`, `${t.color} ${b}`);
          });
          stripe.style.background = `linear-gradient(to bottom, ${stops.join(',')})`;
        } else if (ths[0]) {
          stripe.style.background = ths[0].color;
        } else {
          stripe.style.background = '#ccc';
        }
        const txt = document.createElement('div');
        txt.className = 'dam-event-text';
        txt.textContent = getEventText(item);
        const del = document.createElement('button');
        del.className = 'dam-event-del';
        del.textContent = '삭제';
        del.onclick = (e) => {
          e.stopPropagation();
          events[dk].splice(originalIdx, 1);
          if (events[dk].length === 0) delete events[dk];
          saveEvents();
          render();
          hideDayActionMenu();
        };
        row.onclick = () => {
          hideDayActionMenu();
          openEditEventModal(dk, originalIdx);
        };
        row.appendChild(stripe);
        row.appendChild(txt);
        row.appendChild(del);
        dayActionMenuEl.appendChild(row);
      });
    }

    // 위치
    dayActionMenuEl.style.display = 'block';
    dayActionMenuEl.style.left = '0px';
    dayActionMenuEl.style.top = '0px';
    const w = dayActionMenuEl.offsetWidth;
    const h = dayActionMenuEl.offsetHeight;
    const finalX = Math.min(x, window.innerWidth - w - 8);
    const finalY = Math.min(y, window.innerHeight - h - 8);
    dayActionMenuEl.style.left = finalX + 'px';
    dayActionMenuEl.style.top = finalY + 'px';
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#day-action-menu') && !e.target.closest('.day-cell')) {
      hideDayActionMenu();
    }
  });
  window.addEventListener('blur', hideDayActionMenu);
  window.addEventListener('resize', hideDayActionMenu);

  document.getElementById('cancel-btn').onclick = closeModal;
  document.getElementById('save-btn').onclick = saveNewEvent;
  document.getElementById('prev-month').onclick = () => {
    if (viewMode === 'timetable') { weekOffset--; }
    else { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } }
    render();
  };

  // ─── 테마 공유: 코드 만들기 / 코드로 가져오기 ──────────────────────────
  function collectEventsForTheme(themeId) {
    const out = [];
    Object.keys(events).forEach(dk => {
      if (dk.startsWith('__')) return;
      (events[dk] || []).forEach(item => {
        if (typeof item !== 'object' || !item) return;
        if (item.th === themeId) out.push({ date: dk, item: { ...item } });
      });
    });
    return out;
  }

  async function shareThemeFlow(theme) {
    if (!window.SupabaseAuth?.getUser()) {
      showShareGate();
      return;
    }
    const evs = collectEventsForTheme(theme.id);
    const proceed = await showShareConfirmModal(theme, evs.length);
    if (!proceed) return;

    const payload = buildSharePayload(theme, evs);

    try {
      const code = await window.ThemeShare.publishShare(payload);
      theme.share_code = code;
      theme.share_role = 'owner';
      saveThemes();
      renderThemeModal();
      showInviteLinkDialog(theme.name, code, evs.length);
    } catch (e) {
      showToast('공유 실패: ' + (e.message || e));
    }
  }

      back.querySelector('#gc-ok').onclick = () => close(true);

  // Build the payload sent to theme_shares. The creator block lets the
  // invite-accept modal say "OOO님이 초대했습니다" without the receiver
  // having to query auth.users (anon clients can't).
  function buildSharePayload(theme, evs) {
    const u = window.SupabaseAuth?.getUser();
    const creatorName = window.SupabaseAuth?.userDisplayName?.(u) || '사용자';
    return {
      v: 2,
      theme: { name: theme.name, color: theme.color, image: theme.image || null },
      events: evs,
      creator: { name: creatorName }
    };
  }

  // ─── 공유/초대 헬퍼 ──────────────────────────────────────
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }
  function inviteUrlForCode(code, themeName, fromUser) {
    const url = new URL('invite.html', window.location.href);
    url.searchParams.set('code', code);
    if (themeName) url.searchParams.set('name', themeName);
    if (fromUser)  url.searchParams.set('from', fromUser);
    return url.toString();
  }
  // Accepts either a full invite URL or a bare 8-char code.
  function extractInviteCode(input) {
    const raw = String(input || '').trim();
    if (!raw) return '';
    if (/^https?:\/\//i.test(raw)) {
      try {
        const u = new URL(raw);
        return window.ThemeShare.normaliseCode(u.searchParams.get('invite') || '');
      } catch { return ''; }
    }
    return window.ThemeShare.normaliseCode(raw);
  }

  async function copyToClipboard(text, btnEl) {
    const success = () => { if (btnEl) btnEl.textContent = '복사됨 ✓'; };
    try { await navigator.clipboard.writeText(text); success(); return; }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); success(); }
      catch { alert('복사 실패. 수동으로 복사해주세요.'); }
      ta.remove();
    }
  }

    async function doImport() {

      if (!code) { msg.textContent = '초대 링크 또는 코드를 입력하세요'; return; }

  function applyImportedShare(payload, shareCode) {
    if (!payload || !payload.theme) throw new Error('공유 데이터 형식이 올바르지 않습니다');
    if (themes.length >= 4) throw new Error('테마 4개 한도 초과');
    if (themes.some(t => t.share_code === shareCode)) {
      throw new Error('이미 같은 코드로 가져온 테마가 있습니다');
    }

    const t = payload.theme;
    const newId = 'th_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    const newTheme = {
      id: newId,
      name: (t.name || '가져온 테마') + ' (공유)',
      color: t.color || '#5b9bd5',
      image: t.image || null,
      share_code: shareCode,
      share_role: 'subscriber'
    };
    themes.push(newTheme);

    let added = 0, skipped = 0;
    (payload.events || []).forEach(({ date, item }) => {
      if (!date || typeof item !== 'object' || !item) return;
      if (!events[date]) events[date] = [];
      const newItem = { ...item, th: newId };
      const dup = events[date].some(e => {
        if (typeof e !== 'object' || !e) return false;
        return e.t === newItem.t && e.th === newItem.th;
      });
      if (dup) { skipped++; return; }
      events[date].push(newItem);
      added++;
    });

    // 구독자 테이블에 등록 (fire-and-forget)
    window.ThemeShare?.registerSubscriber(shareCode);

    return { themeName: newTheme.name, eventsAdded: added, eventsSkipped: skipped };
  }

  // ─── 공유 테마 라이브 동기화 ──────────────────────────────────
  // owner: themeManager/event 변경 → 1.2s 디바운스 → theme_shares UPDATE
  // subscriber: 페이지 로드 시 fetch + Realtime UPDATE 구독 → 즉시 반영
  let _republishTimer = null;
  function scheduleOwnedSharesRepublish() {
    if (!window.SupabaseAuth?.getUser()) return;
    clearTimeout(_republishTimer);
    _republishTimer = setTimeout(republishOwnedShares, 1200);
  }
  async function republishOwnedShares() {
    const owned = themes.filter(t => t.share_code && t.share_role === 'owner');
    for (const theme of owned) {
      try {
        const payload = buildSharePayload(theme, collectEventsForTheme(theme.id));
        await window.ThemeShare.updateShare(theme.share_code, payload);
      } catch (e) {
        console.warn('[share] republish failed for', theme.share_code, e);
      }
    }
  }

  // Replace a subscriber theme's metadata + events with the latest payload.
  // Keeps the local theme.id stable so existing UI references don't break.
  function applyShareUpdate(localTheme, payload) {
    if (!payload || !payload.theme) return;
    const t = payload.theme;
    localTheme.name  = (t.name || '가져온 테마') + ' (공유)';
    localTheme.color = t.color || localTheme.color;
    localTheme.image = t.image || null;
    // Drop existing events for this theme, then add the new ones (re-keyed).
    Object.keys(events).forEach(dk => {
      if (dk.startsWith('__')) return;
      const before = events[dk].length;
      events[dk] = events[dk].filter(it => !(typeof it === 'object' && it && it.th === localTheme.id));
      if (events[dk].length === 0) delete events[dk];
    });
    (payload.events || []).forEach(({date, item}) => {
      if (!date || typeof item !== 'object' || !item) return;
      if (!events[date]) events[date] = [];
      events[date].push({ ...item, th: localTheme.id });
    });
  }

  async function pullSubscribedShares() {
    const subs = themes.filter(t => t.share_code && t.share_role === 'subscriber');
    if (subs.length === 0) return false;
    let changed = false;
    for (const theme of subs) {
      try {
        const share = await window.ThemeShare.fetchShare(theme.share_code);
        applyShareUpdate(theme, share.payload);
        changed = true;
      } catch (e) {
        console.warn('[share] pull failed for', theme.share_code, e?.message || e);
      }
    }
    return changed;
  }

  let _shareRealtimeUnsub = null;
  let _shareRealtimeCodes = '';   // serialised set for change detection
  function setupShareRealtime() {
    if (!window.sb || !window.SupabaseAuth?.getUser()) return;
    const codes = themes
      .filter(t => t.share_code && t.share_role === 'subscriber')
      .map(t => t.share_code).sort();
    const key = codes.join(',');
    if (key === _shareRealtimeCodes && _shareRealtimeUnsub) return;
    if (_shareRealtimeUnsub) { _shareRealtimeUnsub(); _shareRealtimeUnsub = null; }
    _shareRealtimeCodes = key;
    if (codes.length === 0) return;
    _shareRealtimeUnsub = window.ThemeShare.subscribeToShareUpdates(new Set(codes), (row) => {
      const subTheme = themes.find(t => t.share_code === row.code && t.share_role === 'subscriber');
      if (!subTheme) return;
      if (row._deleted) {
        // Owner deleted the share. Convert to a local-only theme so the user
        // doesn't lose visible data, but drop the subscriber tagging.
        delete subTheme.share_code;
        delete subTheme.share_role;
        subTheme.name = subTheme.name.replace(/ \(공유\)$/, '') + ' (원본 삭제됨)';
      } else {
        applyShareUpdate(subTheme, row.payload);
      }
      saveThemes();
      saveEvents();
      renderSidebar();
      if (themeModal.classList.contains('active')) renderThemeModal();
      render();
    });
  }

  // ─── 초대 링크 처리 (?invite=CODE) ──────────────────────
  // Fires after the user is signed in. Fetches the share, then shows a modal
  // saying "OOO님이 당신을 '...' 테마로 초대했습니다 / 수락 / 거절".
  async function checkAndShowInvite() {
    const params = new URLSearchParams(window.location.search);
    const rawCode = params.get('invite');
    if (!rawCode) return;
    if (!window.SupabaseAuth?.getUser()) return;  // wait for sign-in; URL preserved

    const code = window.ThemeShare.normaliseCode(rawCode);
    // Strip the param so reloads don't re-prompt forever.
    const url = new URL(window.location);
    url.searchParams.delete('invite');
    window.history.replaceState({}, '', url.toString());

    if (!code) { showToast('초대 링크가 올바르지 않습니다'); return; }
    if (themes.some(t => t.share_code === code)) {
      console.info('[invite] already subscribed to', code);
      showToast('이미 가입된 테마입니다');
      return;
    }

    let share;
    try {
      share = await window.ThemeShare.fetchShare(code);
    } catch (e) {
      showToast('초대 링크 처리 실패: ' + (e.message || e));
      return;
    }
    showInviteAcceptModal(share);
  }

  // Tiny inline toast helper (no existing toast system in this file).
  function showToast(msg) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;font:14px system-ui;z-index:100003;box-shadow:0 4px 12px rgba(0,0,0,.3);';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2500);
    setTimeout(() => el.remove(), 3000);
