<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2e52"/>
      <stop offset="100%" stop-color="#0d1b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft glow blobs -->
  <circle cx="120" cy="540" r="220" fill="#2563eb" opacity="0.07"/>
  <circle cx="1080" cy="90"  r="260" fill="#3b82f6" opacity="0.06"/>

  <!-- Left: calendar icon -->
  <g transform="translate(200, 130)">
    <!-- Frame shadow -->
    <rect x="6" y="6" width="300" height="320" rx="28" fill="rgba(0,0,0,0.35)"/>
    <!-- Frame -->
    <rect width="300" height="320" rx="28" fill="#0f2044" stroke="#2d5fa6" stroke-width="3"/>
    <!-- Header bar -->
    <rect width="300" height="78" rx="28" fill="url(#accent)"/>
    <rect y="50" width="300" height="28" fill="#2563eb"/>
    <!-- Binder rings -->
    <rect x="84"  y="-14" width="15" height="28" rx="7.5" fill="#3b82f6"/>
    <rect x="201" y="-14" width="15" height="28" rx="7.5" fill="#3b82f6"/>
    <!-- Month label -->
    <text x="150" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">2026</text>

    <!-- Day-of-week headers -->
    <text x="42"  y="108" font-family="Arial,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">일</text>
    <text x="88"  y="108" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">월</text>
    <text x="134" y="108" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">화</text>
    <text x="180" y="108" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">수</text>
    <text x="226" y="108" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">목</text>
    <text x="258" y="108" font-family="Arial,sans-serif" font-size="14" fill="#60a5fa" text-anchor="middle">토</text>

    <!-- Date cells row 1 -->
    <circle cx="88"  cy="148" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="134" cy="148" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="180" cy="148" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="226" cy="148" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="258" cy="148" r="16" fill="rgba(255,255,255,0.07)"/>

    <!-- Date cells row 2 — today highlighted -->
    <circle cx="42"  cy="196" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="88"  cy="196" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="134" cy="196" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="180" cy="196" r="18" fill="#2563eb"/>
    <circle cx="226" cy="196" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="258" cy="196" r="16" fill="rgba(255,255,255,0.07)"/>
    <text x="180" y="201" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">29</text>

    <!-- Date cells row 3 -->
    <circle cx="42"  cy="244" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="88"  cy="244" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="134" cy="244" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="180" cy="244" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="226" cy="244" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="258" cy="244" r="16" fill="rgba(255,255,255,0.07)"/>

    <!-- Date cells row 4 -->
    <circle cx="42"  cy="292" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="88"  cy="292" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="134" cy="292" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="180" cy="292" r="16" fill="rgba(255,255,255,0.07)"/>
    <circle cx="226" cy="292" r="16" fill="rgba(255,255,255,0.07)"/>
    <!-- Event dot -->
    <circle cx="88"  cy="196" r="4" fill="#f59e0b" cy="216"/>
  </g>

  <!-- Right: text -->
  <text x="800" y="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif"
        font-size="108" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">달력</text>
  <text x="800" y="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif"
        font-size="30" fill="#7eb3f5" text-anchor="middle" letter-spacing="3">나만의 일정 관리 앱</text>

  <!-- Divider -->
  <rect x="580" y="360" width="440" height="3" rx="1.5" fill="url(#accent)" opacity="0.45"/>

  <!-- Features chips -->
  <rect x="592" y="386" width="96" height="36" rx="18" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="409" font-family="'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif" font-size="16" fill="#7eb3f5" text-anchor="middle">일정</text>

  <rect x="700" y="386" width="96" height="36" rx="18" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="748" y="409" font-family="'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif" font-size="16" fill="#7eb3f5" text-anchor="middle">시간표</text>

  <rect x="808" y="386" width="96" height="36" rx="18" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="856" y="409" font-family="'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif" font-size="16" fill="#7eb3f5" text-anchor="middle">위젯</text>

  <rect x="916" y="386" width="96" height="36" rx="18" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="964" y="409" font-family="'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif" font-size="16" fill="#7eb3f5" text-anchor="middle">테마</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="614" width="1200" height="16" fill="url(#accent)" opacity="0.55"/>
</svg>
