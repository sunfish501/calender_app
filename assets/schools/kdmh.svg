<?xml version="1.0" encoding="UTF-8"?>
<!-- 한국디지털미디어고등학교 (디미고) 로고 — 핑크 @ 스타일 (image 2 근사).
     외곽 C-ring: 우측 2~5시 방향 ~90° 갭
     내부 C-ring: 우측 2~4시 방향 ~60° 갭
     중앙 솔리드 도트
     필요시 이 파일을 학교 공식 SVG/PNG 로 교체하면 자동 반영됨. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="한국디지털미디어고등학교 로고">
  <!-- Outer ring: start (82.9, 31) = 2 o'clock, end (69, 83.1) = 5 o'clock
       sweep CCW (visual) through 12 → 9 → 6 → back to 5 o'clock = 270° arc -->
  <path d="M 82.9 31 A 38 38 0 1 0 69 83.1"
        fill="none" stroke="#D8338E" stroke-width="12" stroke-linecap="butt"/>
  <!-- Inner ring: start (69, 39) = 2 o'clock, end (69, 61) = 4 o'clock
       sweep CCW (visual) through 12 → 9 → 6 → back to 4 o'clock = 300° arc -->
  <path d="M 69 39 A 22 22 0 1 0 69 61"
        fill="none" stroke="#D8338E" stroke-width="9" stroke-linecap="butt"/>
  <!-- Center solid dot -->
  <circle cx="50" cy="50" r="8" fill="#D8338E"/>
</svg>
