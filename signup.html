<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원가입 - 달력</title>
<link rel="icon" type="image/x-icon" href="calendar.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #222;
  }
  .card {
    background: #fff;
    padding: 32px 28px 24px;
    border-radius: 14px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 12px 32px rgba(0,0,0,.08);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #555;
    margin: 10px 2px 4px;
    font-weight: 500;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d8d8dc;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: #222;
  }
  input:focus { outline: none; border-color: #2874e0; }
  .hint {
    font-size: 11px;
    color: #888;
    margin: 4px 2px 0;
    line-height: 1.4;
  }
  .msg {
    color: #c33;
    font-size: 12px;
    margin: 14px 0 6px;
    min-height: 16px;
    line-height: 1.3;
  }
  .msg.ok { color: #2874e0; }
  button {
    width: 100%;
    padding: 12px;
    background: #2874e0;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    margin-top: 6px;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #1d5cb8; }
  .back {
    display: block;
    text-align: center;
    margin-top: 14px;
    color: #666;
    font-size: 13px;
    text-decoration: none;
  }
  .back:hover { color: #2874e0; }
</style>
</head>
<body>
  <div class="card">
    <h1>달력 회원가입</h1>

    <label for="signup-id">아이디</label>
    <input id="signup-id" type="text" placeholder="example_id" autocomplete="username">
    <div class="hint">4~20자, 영문/숫자/_ 만 사용 가능</div>

    <label for="signup-pw">비밀번호</label>
    <input id="signup-pw" type="password" placeholder="6자 이상" autocomplete="new-password">

    <label for="signup-pw2">비밀번호 확인</label>
    <input id="signup-pw2" type="password" placeholder="다시 입력" autocomplete="new-password">

    <label for="signup-nick">닉네임 <span style="color:#aaa;font-weight:400;">(선택)</span></label>
    <input id="signup-nick" type="text" placeholder="표시 이름" maxlength="20">

    <div id="signup-msg" class="msg"></div>

    <button id="signup-go">가입하기</button>
    <a class="back" href="calendar.html">← 로그인으로 돌아가기</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const idEl   = document.getElementById('signup-id');
    const pwEl   = document.getElementById('signup-pw');
    const pw2El  = document.getElementById('signup-pw2');
    const nickEl = document.getElementById('signup-nick');
    const msgEl  = document.getElementById('signup-msg');
    const btnEl  = document.getElementById('signup-go');

    function setMsg(text, ok) {
      msgEl.textContent = text || '';
      msgEl.className = 'msg' + (ok ? ' ok' : '');
    }

    async function doSignup() {
      const id   = idEl.value.trim();
      const pw   = pwEl.value;
      const pw2  = pw2El.value;
      const nick = nickEl.value.trim();

      if (!window.SupabaseAuth?.isValidId(id)) {
        setMsg('아이디는 4~20자 영문/숫자/_ 만 가능합니다');
        idEl.focus();
        return;
      }
      if (pw.length < 6) { setMsg('비밀번호는 6자 이상이어야 합니다'); pwEl.focus(); return; }
      if (pw !== pw2)    { setMsg('비밀번호 확인이 일치하지 않습니다'); pw2El.focus(); return; }

      setMsg(''); btnEl.disabled = true;
      try {
        const result = await window.SupabaseAuth.signUpWithId(
          id, pw, nick ? { nickname: nick } : {}
        );
        if (!result?.session) {
          // Happens if email confirmation is still ON in the Supabase dashboard.
          setMsg(
            '가입은 됐지만 세션이 발급되지 않았습니다. ' +
            '관리자에게 "이메일 인증 OFF" 설정을 요청하세요.',
            false
          );
          btnEl.disabled = false;
          return;
        }
        setMsg('가입 완료! 캘린더로 이동합니다.', true);
        setTimeout(() => { window.location.href = 'calendar.html'; }, 700);
      } catch (e) {
        const m = e.message || '가입 실패';
        if (/already.*registered|user already exists/i.test(m)) {
          setMsg('이미 사용 중인 아이디입니다');
        } else if (/password.*should.*be.*at least/i.test(m)) {
          setMsg('비밀번호는 6자 이상이어야 합니다');
        } else {
          setMsg(m);
        }
        btnEl.disabled = false;
      }
    }

    btnEl.onclick = doSignup;
    [idEl, pwEl, pw2El, nickEl].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });
    });
    setTimeout(() => idEl.focus(), 50);
  </script>
</body>
</html>
